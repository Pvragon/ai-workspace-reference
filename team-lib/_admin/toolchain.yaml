version: "1.0"

cli_tools:
  gh:
    description: "GitHub CLI"
    install_type: apt
    install_command: "apt-get install -y gh"
    check_command: "gh --version"
    required: true
    post_install_notes: "Run 'gh auth login' to authenticate."

  gws:
    description: "Google Workspace CLI (Drive, Docs, Sheets, Gmail, Calendar)"
    install_type: npm
    install_command: "npm install -g @googleworkspace/cli"
    check_command: "gws --version"
    required: true
    post_install_notes: |
      Run 'gws auth login' to authenticate.
      WSL users: browser auth may not auto-launch. Copy the URL manually.

  claude:
    description: "Claude Code (agent CLI)"
    install_type: npm
    install_command: "npm install -g @anthropic-ai/claude-code"
    check_command: "claude --version"
    required: true
    post_install_notes: "Run 'claude' once in ~/ai-workspace/my-lib and complete /login (Pvragon Claude account or API key)."

# Servers that CANNOT be provisioned from here, kept so the knowledge is not lost.
# configure_toolchain.sh does not read this section — listing them under mcp_servers
# implied an install that cannot happen, and validate would have chased them forever.
manual_mcp_servers:
  pencil:
    description: "Pencil design-file editor (.pen)"
    why_manual: >-
      The server ships inside the Pencil VS Code extension, so its command is an absolute
      path carrying an extension version and the local username. There is no portable form.
    configure_by_hand: >-
      command: ~/.vscode-server/extensions/highagency.pencildev-<version>/out/mcp-server-linux-x64
      args: ["--app", "visual_studio_code", "--agent", "claudeCodeCLI"]

mcp_servers:
  context7:
    description: "Up-to-date library/framework documentation lookup"
    required: true
    config:
      claude:
        type: stdio
        command: npx
        args: ["-y", "@upstash/context7-mcp@latest"]
        env: {}
      gemini:
        command: npx
        args: ["-y", "@upstash/context7-mcp@latest"]

  playwright:
    description: "Browser automation and page inspection"
    required: true
    config:
      claude:
        type: stdio
        command: npx
        args: ["@playwright/mcp@latest"]
        env: {}
      gemini:
        command: npx
        args: ["@playwright/mcp@latest"]
    post_install_notes: "Downloads its own browser on first use. To pin an existing Chromium add --executable-path <path>; the operator's machine also passes --config. Both are per-machine and deliberately not baked in here."

  clickup:
    description: "ClickUp project management (optional — the clickup-cli integration is the path we actually use)"
    required: false
    config:
      claude:
        type: stdio
        command: npx
        args: ["-y", "mcp-remote", "https://mcp.clickup.com/mcp"]
        env: {}
      gemini:
        command: npx
        args: ["-y", "mcp-remote", "https://mcp.clickup.com/mcp"]
    post_install_notes: "Requires ClickUp OAuth — will prompt in browser on first use."

  baserow:
    description: "Baserow database (Pvragon instance)"
    required: true
    env_vars_required: ["BASEROW_MCP_TOKEN"]
    config:
      claude:
        type: stdio
        command: bash
        args: ["-c", "source ~/ai-workspace/personal/secrets/.env && npx mcp-remote https://br.pvragon.com/mcp/$BASEROW_MCP_TOKEN/sse"]
        env: {}
    post_install_notes: "Ensure BASEROW_MCP_TOKEN is set in personal/secrets/.env"

  excalidraw:
    description: "Excalidraw diagramming"
    required: false
    config:
      claude:
        type: http
        url: "https://mcp.excalidraw.com"
