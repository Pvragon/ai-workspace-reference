# summary: Hand-authored listing + category for skills whose own files we may NOT edit — today the
#   third-party `_external/` packs. Keyed by HARNESS name (the folder name the harness lists, e.g.
#   `ext-pdf`, as minted by link_skills.py). Read by build_registry.py and build_skill_overrides.py.
# ---------------------------------------------------------------------------------------------
# ⚑ ONE OWNER PER FACT. A skill we own carries `listing:` and `category:` in its own SKILL.md
#   frontmatter; this file exists only because progressive-disclosure-convention.md forbids editing
#   `_external/` files. Do not add an internal skill here — put the fields in its frontmatter.
#
# Resolution order (first hit wins), implemented once in build_registry.resolve_listing():
#   1. the skill's own frontmatter
#   2. my-lib/config/skill-listing.yaml   (personal overrides; my-lib's registry only)
#   3. THIS file
#   4. `listing_defaults` in the repo's config/registry-map.yaml, by provenance
#      (external -> user-only, so an entry here with no `listing:` is hidden from the model but
#      still runs when the user types /<name>)
#
# Values:
#   listing:  on | name-only | user-only | off
#             (`off` is sidecar-only: it also removes /<name> for the user. Never in frontmatter.)
#   category: one key of config/skill-categories.yaml
#
# Day-one exception: ext-blader-humanizer is `name-only` because my-lib AGENTS.md's humanizer gate
# requires it on every human-facing deliverable.
# Called-by-internal exception (2026-10-16): the externals that an internal skill tells the model to
# invoke are `name-only`, because the Skill tool refuses a user-only skill ("disabled for model
# invocation"). Callers: build-brand-site and its brand-site-* stages (frontend-design,
# ui-design-system, theme-factory, senior-architect/-frontend/-security/-qa/-devops,
# webapp-testing, ponytail-review, content-production, content-strategy, marketing-strategy-pmm), one-mahjong taste-judge
# (frontend-design) and my-lib paper-game-printable (web-artifacts-builder). Re-check with
#   grep -rlE '\bext-[a-z0-9-]+' --include=SKILL.md <skills trees> (excluding _external/)
# when a new caller names an external. The office packs (ext-docx/pdf/xlsx/pptx) stay at
# the external default; a layer with a visible twin (synced `anthropic-skills:*`) covers them.
# ---------------------------------------------------------------------------------------------

