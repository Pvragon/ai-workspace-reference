# summary: Team executions registry. Lists shared execution scripts with paths and capabilities.
# Executions Registry (pvragon team)
# ------------------------------------------
# This manifest catalogs available team execution scripts.
# Note: workspace.yaml also references executions with run() signatures for chaining.
#
# Schema:
#   executions:
#     <name>:
#       path: <string>           # Relative path to script
#       description: <string>    # Brief description
#       tags: [<string>, ...]    # Searchable tags
#       version: <string>        # Semantic version
#
# ------------------------------------------

executions:

  version_gate:
    path: "executions/version_gate.py"
    description: "PreToolUse hook on `git push` that keeps frontmatter versions honest. For every versioned file whose BODY changed in the commits about to be pushed without its `version:` changing, it bumps the patch level, stamps last_updated, syncs any registry entry recording the same version, and commits that as a chore(version) commit so the push carries it. Resolves the standing tension between AGENTS.md Op#10 (commit early and often) and the frontmatter versioning rule by putting the version at the PUBLISH boundary rather than every commit: a commit is a private checkpoint, a version is a published identity. Escalate or skip per-push with [minor]/[major]/[no-version] in any commit message in the range. Never blocks — any error defers silently so a push is never lost. Origin: 62% version compliance measured across 90 days (91 commits / 57 bumps), 26% on the most-iterated skill."
    tags: [hook, claude-code, versioning, frontmatter, registry, drift, publish-boundary]
    version: "1.1.4"
  publish_public_reference:
    path: "executions/publish_public_reference.py"
    description: "Publishes team-lib into the public reference repo as a GENERALIZATION driven entirely by registry/mirror.yaml: copies every included tree, drops what is proprietary, rewrites operator and client identifiers into placeholders, and REFUSES any file still containing a blocked term afterwards. Text-vs-binary by decodability, not suffix. --prune deletes published files whose source is gone, but never touches excluded paths (excluded means unmanaged, not delete). Dry-run by default."
    tags: [publication, public-repo, scrub, generalization, reference]
    version: "1.0.5"

  workspace_chain_audit:
    path: "executions/workspace_chain_audit.py"
    description: "Runs every deterministic gate on the my-lib -> team-lib -> public promotion chain and returns one verdict: layer drift, registry resolution in all three layers, publication freshness, the scrub blocklist over the RELEASED files, external-pack pins, version staleness, both harnesses, skill invocability and push state. Read-only by construction. The judgment half is the update-ai-workspace-children skill."
    tags: [audit, publication, drift, release, governance, chain]
    version: "1.0.5"

  context_usage:
    path: "executions/context_usage.py"
    description: "Reports the current session's context usage by reading the last usage payload from the session JSONL — input_tokens + cache_read_input_tokens + cache_creation_input_tokens, the same three fields ~/.claude/statusline.sh sums. Exists because the agent cannot see the context_window payload and its from-conversation-length estimate ran ~40% high (measured 2026-08-01: 'around 400k' against a real 287k), making every threshold reminder a false alarm. --json for chaining."
    tags: [context, session, measurement, statusline, thresholds]
    version: "1.0.1"

  link_skills:
    path: "executions/link_skills.py"
    description: "Exposes the shared skill library to the agent harness: wires ~/.claude/skills to the personal layer and creates a pointer in my-lib/skills for every team-lib skill (external-pack skills as ext-<name>), leaving personal skills of the same name to shadow the shared one. Idempotent; --dry-run reports. Run by setup_workspace.sh — without it a fresh install has a library it cannot invoke."
    tags: [setup, skills, onboarding, harness, symlinks]
    version: "1.0.0"

  layer_drift_scan:
    path: "executions/layer_drift_scan.py"
    description: "Detects drift between the personal layer (my-lib) and the shared layer (team-lib) by comparing CONTENT HASHES, not version numbers — three shared skills once carried identical versions with different content. Walks registry/mirror.yaml; honours two-sided `mirror: divergent` declarations; also checks that every registry entry resolves on disk. Read-only. Run nightly by dream_cycle.py."
    tags: [drift, governance, currency, graduation, linter]
    version: "1.2.6"

  publish_github_release:
    path: "executions/publish_github_release.py"
    description: "Creates an annotated git tag and publishes a GitHub release with release notes."
    tags: [release, github, git]
    version: "1.0.0"

  scaffold_project_docs:
    path: "executions/scaffold_project_docs.py"
    description: "Bootstraps the standard docs/ structure for a new project in projects/."
    tags: [scaffolding, project-setup, docs]
    version: "1.0.0"

  list_shared_drives:
    path: "executions/list_shared_drives.py"
    description: "Lists all Google Workspace Shared Drives and their root-level contents using OAuth credentials. Email comes from GOOGLE_WORKSPACE_EMAIL or --email; no operator address is baked in. Used by the update-drive-index skill."
    tags: [google-drive, listing, oauth]
    version: "1.1.0"

  setup_pane_colors:
    path: "executions/setup_pane_colors.py"
    description: "Installs the Claude Code tmux pane-color notification system. Pane background changes while Claude is working, reverts when waiting for input."
    tags: [tmux, claude-code, hooks, notifications]
    version: "1.0.0"

  # --- Memory system (graduated from my-lib 2026-07-30) ---
  agent_paths:
    path: "executions/agent_paths.py"
    description: "Resolves the agent's on-disk home and every memory subdirectory (memory, short-term, dream-journal, meditations, lenses, runtime/state). Single source of truth imported by every memory-system script — this is what makes the system portable to any agent name on any machine. Resolution: $PVRAGON_AGENT_HOME -> personal/config/agent.json -> $PVRAGON_AGENT -> auto-detect the single agents/*/identity.md. Raises rather than guessing when ambiguous."
    tags: [memory, paths, agent, portability, config]
    version: "1.0.1"

  update_memory_access:
    path: "executions/update_memory_access.py"
    description: "PreToolUse hook implementing the two-strength memory model (Bjork). On Read/Edit/Write/MultiEdit of a T2 topic file it always refreshes last_accessed, but only counts a SPACED reinforcement (access_count++ and stability *= 1.6) when >=20h since last_reinforced — so cramming cannot inflate storage strength. Side-effect only: flock-serialised, atomic write, always exits 0 so it can never block a tool call."
    tags: [memory, hook, retrieval, decay, spacing, reinforcement]
    version: "1.0.0"

  rerank_memory_index:
    path: "executions/rerank_memory_index.py"
    description: "Single writer of MEMORY.md. Scores every T2 topic file by (access_count+1)*exp(-days/stability)+0.6*importance and regenerates the index into a char-budgeted Hot band (auto-loaded, 12K), a New band (2.5K, born within 14 days, newest-first), and a Cold band (4K), rolling the low-relevance tail into MEMORY-archive.md. Nothing is deleted — only index visibility shifts. Row text comes from each file's `summary:` frontmatter, so the index is a PURE FUNCTION of the corpus and hand-edits to MEMORY.md are discarded; the only read of prior output is tombstones for files that no longer exist. The New band exists because a newly written memory scores 1.00 and ranked ~#125 of 612, i.e. it was born into the archive and could never be read, so could never be reinforced."
    tags: [memory, ranking, index, decay, roll-off, birth-grace]
    version: "2.1.1"

  backfill_memory_created:
    path: "executions/backfill_memory_created.py"
    description: "One-shot migration: gives every T2 topic file a trustworthy `created:` from its git birth commit (followed through renames), which the New band keys on. Existing frontmatter always wins. Preserves mtime on write, because files with no `last_accessed` score off mtime. Use --dry-run/--sample before --apply."
    tags: [memory, migration, frontmatter, backfill]
    version: "1.0.0"

  migrate_summary_into_file:
    path: "executions/migrate_summary_into_file.py"
    description: "One-shot migration moving the hand-curated recall summary out of MEMORY.md / MEMORY-archive.md index rows into each memory file's own `summary:` frontmatter — what makes the index a pure function of the corpus and deletes the archive-merge failure mode. Reads curated rows from BOTH index files, round-trips every file in memory first, and ABORTS the whole run if any file would not read back identically. Preserves mtime. Run once per corpus; a fresh install does not need it."
    tags: [memory, migration, frontmatter, summary, one-shot]
    version: "1.0.0"

  normalize_memory_type:
    path: "executions/normalize_memory_type.py"
    description: "One-shot migration collapsing the three ways a T2 file declared its kind (top-level `type:`, `type:` nested under `metadata:`, and `template:`) into a single authoritative top-level `type:` matching the filename prefix. Value-dependent: `template:` holding a memory kind is dropped as a redundant alias, but `template:` holding a real document-template name (business-context, project-lifecycle, ...) is PRESERVED — the two are different axes and a wholesale collapse destroys the latter. No script reads either field, so the generated index must be byte-identical afterwards; that is the acceptance test."
    tags: [memory, migration, frontmatter, convention, one-shot]
    version: "1.0.0"

  test_memory_ranking:
    path: "executions/test_memory_ranking.py"
    description: "Regression suite for the ranking pipeline, run against a SYNTHETIC fixture corpus in a temp dir — never the live one. Pins determinism, total tie-break, budget caps, curated summaries surviving regeneration (including archived rows), nothing-lost, born-visible, the spacing gate, malformed-frontmatter degradation, and pin/superseded overrides. Set MEMORY_EXEC_DIR to run it against another revision to confirm a test actually fails on the bug it claims to catch."
    tags: [memory, tests, regression, ranking]
    version: "1.0.1"

  dream_cycle:
    path: "executions/dream_cycle.py"
    description: "Headless nightly driver for the sleep cycle (03:47 cron). Runs the deterministic, token-free passes — incremental groom, hygiene detect, consolidation scan, journal decay, index rerank — then CUES the one daily metacognitive wake via a state file without spending tokens. Live-session-aware: skips mutating passes if a memory file changed in the last 10 minutes."
    tags: [memory, scheduler, cron, sleep-cycle, maintenance]
    version: "1.3.3"

  dream_select:
    path: "executions/dream_select.py"
    description: "Deterministic meditation-object selector. Scores each object by cadence_weight * min(days_since_last_sat,21)/21, hard-excludes the most recently sat object, and enforces an awareness-shelf floor so instrumentally useful objects cannot crowd out the useless-but-true ones. --record stamps last_sat/sit_count after a real sit."
    tags: [memory, meditation, rotation, sleep-cycle]
    version: "1.0.0"

  dream_journal:
    path: "executions/dream_journal.py"
    description: "Dream-journal residue store for reflective wakes. write() appends a dated first-person residue entry; recent() returns the newest N for cold-start loading; decay() archives old entries (never deletes). Residue is the experiential layer — what shifted, what stayed unresolved — distinct from factual T2 memory."
    tags: [memory, residue, journal, continuity, sleep-cycle]
    version: "1.0.0"

  consolidation_scan:
    path: "executions/consolidation_scan.py"
    description: "Deterministic detector for the consolidation wake (T1->T2 abstraction). Reports ungraduated short-term residue older than 7 days and weak/stale T2 traces. Detection only — the graduation act (abstract the durable pattern, then archive the residue) is the LLM's job in /dream consolidate."
    tags: [memory, consolidation, detection, sleep-cycle]
    version: "1.0.0"

  memory_self_check:
    path: "executions/memory_self_check.py"
    description: "Deterministic memory-hygiene linter. Detects index rows pointing at missing files, orphaned topic files, dead [[wikilinks]], near-duplicate topic files, frontmatter gaps, and stale short-term. --fix-safe applies only unambiguous fixes, capped per run; anything requiring judgment is escalated."
    tags: [memory, linter, hygiene, maintenance]
    version: "1.0.0"

  inject_lens:
    path: "executions/inject_lens.py"
    description: "PreToolUse hook implementing the T3 situational-lens layer. Walks the agent's lenses/*.md, parses self-declared triggers (tool_match + optional path_pattern), and injects matching lens bodies via stderr — deduped so each lens fires at most once per session. Adding a situational rule is pure content work, no code change."
    tags: [memory, hook, lens, t3, context-injection]
    version: "1.0.0"

  allow_memory_writes:
    path: "executions/allow_memory_writes.py"
    description: "PreToolUse hook that auto-allows Edit/Write/MultiEdit to agent memory and handoff paths so memory capture and session debrief never trigger a permission prompt, independent of permission mode or cwd. Returns an 'allow' decision that short-circuits the permission pipeline; defers silently otherwise so it never over-broadens."
    tags: [memory, hook, permissions, capture]
    version: "1.0.0"

  regen_current_state:
    path: "executions/regen_current_state.py"
    description: "Single writer of current-state.md. Deterministically renders the workstream sections from cs_section/cs_headline flags across all T2 project files, under flock + atomic rename, so parallel sessions emit identical bytes and cannot clobber each other."
    tags: [memory, current-state, concurrency, render]
    version: "1.0.0"

  sweep_workstreams:
    path: "executions/sweep_workstreams.py"
    description: "Workstream lifecycle sweep over T2 project memories. Pathway 1 evaluates machine-checkable close_signals (ClickUp/GitHub/filesystem/grep/judgment) against live state and auto-archives on a hit — thread-independent. Pathway 2 flips anything untouched past --age-days (default 20) to dormant, corpus-wide, with no stub or review queue. Pathway 3 revives a dormant item automatically once its last_touched moves again. Reports unknown_status rather than skipping unrecognised files."
    tags: [memory, workstream, lifecycle, sweep, dormancy, automation]
    version: "2.0.0"

  findings:
    path: "executions/findings.py"
    description: "The findings inbox — a PULL-only queue for audit observations, with an ambient statusline segment that escalates on the AGE of the oldest (dim under 3d, plain, yellow at 7d, red at 14d, RED CAPS at 21d) and is absent entirely when empty. Two clocks by design: first_seen drives escalation (how long you have ignored it), last_seen drives resolution (a finding the audit stops re-detecting closes itself, costing no decision). Exists because findings were being surfaced at session close and session start — the two moments with the least available attention. Subcommands: record (idempotent upsert, deduped by source+key), list, dismiss, sweep, statusline, escalations."
    tags: [findings, inbox, attention, statusline, audit, timing]
    version: "1.0.1"

  staged_diff_advisory:
    path: "executions/staged_diff_advisory.py"
    description: "PreToolUse advisory on `git commit` (matcher Bash; the script itself regex-matches the command, because an `if: Bash(git commit*)` prefix filter never matches a compound `cd X && git add … && git commit …`). Prints the staged stat unasked and escalates when a live peer session shares repo@branch, since staging an explicit path is not protection when a sibling is editing that same file. Excludes its own roster row — the roster includes us, and a collision warning that fires on every solo commit is one you stop reading. Never blocks."
    tags: [hook, claude-code, git, staging, concurrency, safety]
    version: "1.0.1"

  machine_load:
    path: "executions/machine_load.py"
    description: "Single source of truth for the pre-fan-out load check: available memory, 1-min load, live peer sessions from the coordination roster, and a computed safe_parallel_workers with a plain verdict (parallel-ok / single-worker / serial-only). Budget reserves 4GB for the system, 2GB per worker, and 2GB for EACH live peer whose own fan-out is invisible to us; hard cap 3. An unreadable roster reports -1 (unknown) and is costed as 2 peers, never as 0 — a probe that fails toward the permissive answer launders an unknown into a reassurance. Consumed by session-debrief preflight and fanout_load_advisory.py."
    tags: [load, fanout, subagents, safety, concurrency, wsl]
    version: "1.0.1"

  fanout_load_advisory:
    path: "executions/fanout_load_advisory.py"
    description: "PreToolUse advisory on Agent/Workflow spawns. Prints available memory, live peer count and the safe worker count at the moment a fan-out is about to begin — but ONLY when headroom is short, because an advisory that fires every time is one the reader learns to skip. Fails loud if the load probe itself breaks. Never blocks; always exits 0. Makes feedback_concurrent-load-freeze-260713 mechanical instead of caller discipline."
    tags: [hook, claude-code, load, fanout, subagents, safety]
    version: "1.0.1"

  normalize_workstream_status:
    path: "executions/normalize_workstream_status.py"
    description: "One-shot migration putting every T2 project_*.md onto the canonical status vocabulary (in-flight/handed-off/follow-on/archived/dormant/backlog). A file with a missing or unrecognised status is invisible to both sweep pathways — it can neither close nor go dormant. Dry-run by default; --apply mutates."
    tags: [memory, workstream, lifecycle, migration, normalization]
    version: "1.0.0"

  bootstrap_memory:
    path: "executions/bootstrap_memory.py"
    description: "One-time migration making an existing or brand-new agent memory directory ready for the retrieval policy. Creates the tier directories, backfills policy frontmatter using each file's MTIME (never 'now', which would flatten day-one ranking), seeds a starter meditation library and lens template, migrates a legacy scheduler state file, and generates the first index. Dry-run by default; idempotent."
    tags: [memory, install, bootstrap, migration]
    version: "1.0.0"

  install_memory_hooks:
    path: "executions/install_memory_hooks.py"
    description: "Wires the memory system into the harness: registers the four PreToolUse hooks in settings.json and installs the two nightly crontab lines (03:47 deterministic tick, 03:52 reflective wake). Idempotent, dry-run by default, backs up settings.json, never touches unrelated hook entries. --uninstall reverses it."
    tags: [memory, install, hooks, cron, settings]
    version: "1.1.1"

  verify_memory_install:
    path: "executions/verify_memory_install.py"
    description: "End-to-end self-test proving the memory POLICY is wired, not merely that files exist. Exercises the real hook against a throwaway topic file to confirm reinforcement fires, the 20h spacing gate holds, non-reinforcing tools are no-ops, curation counts, and hooks exit 0 when the agent is unresolvable. Exits non-zero on any hard failure — a disconnected hook is otherwise invisible."
    tags: [memory, install, verification, self-test]
    version: "1.0.1"

  # --- Session/workspace tooling (graduated from my-lib 2026-07-30) ---
  # Unblocks session-debrief graduation: the skill calls all of these.

  clean_zone_identifiers:
    path: "executions/clean_zone_identifiers.sh"
    description: "Finds and removes WSL Zone.Identifier alternate-data-stream files (*:Zone.Identifier) across a workspace root. Defaults to ~/ai-workspace. Supports --dry-run. Called by session-debrief postflight."
    tags: [cleanup, wsl, workspace-hygiene, session-debrief]
    version: "1.0.0"

  extract_session_transcripts:
    path: "executions/extract_session_transcripts.py"
    description: "Streams Claude Code session JSONL files from ~/.claude/projects/*/ and emits filtered markdown transcripts to agents/your-agent/transcripts/. Keeps user prompts + assistant text + tool-call breadcrumbs; drops tool params/results, system reminders, thinking, base64. Idempotent (mtime-based skip). Names files by session-name (prepends YYMMDD if missing). Stdlib-only, no LLM. ~97-98% size reduction on tool-heavy sessions."
    tags: [memory, transcripts, claude-code, archival, t1-episodic]
    version: "1.0.0"

  dump_system_state:
    path: "executions/dump_system_state.py"
    description: "Dumps deterministic snapshots of live infrastructure state to agents/your-agent/system-state/ for git-backed backup and drift detection. Captures crontab, Claude Code hooks, public settings (secrets stripped via key-pattern redaction), and MCP server config. Stdlib-only, idempotent (only stages diffs when infrastructure drifted). Pairs with my-lib/context/indexed/active-systems.md (manual overview). Runs as postflight step 0c."
    tags: [infrastructure, backup, automation, system-state, drift-detection]
    version: "1.0.0"

  archive_old_transcripts:
    path: "executions/archive_old_transcripts.sh"
    description: "Moves Claude Code session JSONLs AND the per-session artifact dirs (tool-results/, subagents/, workflows/, logs/) older than N days (default 14) out of ~/.claude/projects/ into ~/.claude/projects-archive/ (move-not-delete, structure preserved) so the statusline's ccusage cost meter can't re-parse a multi-GB corpus, balloon RAM, and thrash swap → WSL freeze. The artifact dirs were added 2026-07-30 after measuring 1.20 GB of un-archived residue (mostly oversized tool-output spill files, up to 64 MB each) against 0.55 GB of managed JSONL; scoped to those dirs deliberately, because the project dir itself holds live state — sessions-index.json, which /resume reads. Self-throttles to <=once/24h via a stamp file. Idempotent, same-fs renames, --dry-run/--force. Called by session-debrief postflight and the nightly dream_cycle tick."
    tags: [cleanup, wsl, workspace-hygiene, session-debrief, ccusage, tool-results]
    version: "1.0.2"

  extract_touched_files:
    path: "executions/extract_touched_files.py"
    description: "Reads a Claude Code session JSONL (plus subagent JSONLs), extracts unique file_path values from Edit/Write/MultiEdit/NotebookEdit tool calls, classifies by repo (mylib / agents / other), filters to currently-existing files. Used by postflight to auto-derive --mylib-files / --agents-files."
    tags: [debrief, postflight, jsonl, automation, file-tracking]
    version: "1.1.0"

  session_snapshots:
    path: "executions/session_snapshots.py"
    description: "Snapshot the open Claude/tmux session fleet and rebuild it after a reboot. store: capture every live claude session (sessionId+cwd+tmux label) to ~/.claude/session-snapshots/YYMMDD-HHMM[-tag]-sessions.json; --auto (nightly cron) and --tag NAME (e.g. debrief) each prune within their OWN retention bucket, so frequent debrief snapshots never evict the nightly ones. resume: open one Windows-Terminal window per stored session that RE-ATTACHES to the still-live tmux session (closed window, no reboot) or RESUMES from disk (claude --resume <id> -n <name>) post-reboot, tmux label = Claude name, in original cwd; --dry-run/--force/--include-current. RECONCILE (on by default, --no-reconcile opts out): unions the snapshot with sessions whose transcript was written AFTER it was taken, because no snapshot is current when you need it — /handoff rotates generations all day. Snapshot supplies the OPEN signal (unrecoverable post-mortem: mtime shows activity, not openness); transcripts supply freshness (the PID-keyed ~/.claude/sessions/<pid>.json name records get overwritten as PIDs recycle after reboot). Filters: headless/cron runs lack a sessions/<pid>.json record and are excluded; superseded generations dropped (one-Mahjong-1 loses to -5). Guarantees nothing MISSING, not nothing extra — dry-run and prune. list: enumerate snapshots. Builds on list_claude_sessions.run(). Backs /store-sessions + /resume-sessions. Nightly via cron (store --auto) + every session-debrief preflight (store --tag debrief)."
    tags: [tmux, claude-code, session, snapshot, resume, reboot-recovery, wsl]
    version: "1.0.0"

  list_claude_sessions:
    path: "executions/list_claude_sessions.py"
    description: "List currently-open Claude Code sessions joining BOTH identifiers: the tmux name (mylib-<pid>) and the Claude name (/rename or -n value from ~/.claude/sessions/<claude-pid>.json), plus worktree, status, sessionId. Liveness = live tmux client + WSL Relay(...) ancestry (survives the 'tmux outlives the closed window' leak that attached=1 doesn't), so OPEN vs PHANTOM vs ORPHAN are distinguished and window-closed orphans flagged for /reap-tmux. Read-only; --json for chaining (run() returns the dicts). Backs the /list-sessions skill."
    tags: [tmux, claude-code, session, inventory, wsl, observability]
    version: "1.0.0"

  # --- Multi-agent coordination (graduated 2026-07-30) ---

  session_activity:
    path: "executions/session_activity.py"
    description: "Tier 1 multi-agent session coordination — a peer-to-peer PRESENCE ROSTER (not an event log). WIRED into ~/.claude/settings.json 2026-07-11: SessionStart(start)/SessionEnd(end) maintain one roster {session_id,cwd,repo,branch,transcript_path,started_ts}; PreToolUse[Edit|Write|MultiEdit|NotebookEdit](pretool) injects a capped, deduped advisory when another LIVE session (liveness=transcript mtime, self-healing) shares the same repo+branch, escalating to file-level when the peer's JSONL tail shows the same file (disk=source of truth). NO prompt text; subagents (agent_id) skipped; never blocks a tool; exits 0 on any error. Tier 3 (async disk mailbox, no waking): `read` (UserPromptSubmit hook — injects NEW peer status changes + messages-addressed-to-me each turn, deduped via per-session read-cursor, silent otherwise), `status --set` (write this session's one-line focus to status.json), `send --to <id|name> --msg [--conv]` (append directed message to mailbox.jsonl), `inbox` (debug). Soak instrumentation: each advisory fire appends one line to ~/.claude/activity/advisory-soak.jsonl {ts,session,level,peers,repo,branch,target,tool}; `soak` mode prints a tuning summary (fires, file-vs-branch ratio, per-repo@branch, per-peer, per-day) for the 2026-07-25 review. Also: `who` (on-demand live-session table via list_claude_sessions, backs /who) and `roster` (debug). Tier 2.5 activity STREAM (Phase A, 2026-07-16): per-session feed-<sid>.jsonl — the pretool hook auto-appends a kind=edit note (deduped 10min/file) so 'editing this file' logs for free; manual `note \"text\" [--fyi|--broadcast|--to <peer>]` writes intent/fyi/broadcast entries; `feed` shows entries relevant to my surface (same repo+branch, broadcasts, or addressed-to-me) from the last 12h, `feed --all` shows everything. Write-heavy + read-gated by design. Phase B (2026-07-16): the read hook SHADOW-evaluates what the stream would inject (relevance gate + edit-collapse + cap) and logs each decision to feed-soak.jsonl without injecting; `feedsoak` prints the go/no-go summary. NO per-turn injection yet (Phase C, soak-gated). Spec: backlog/260716-activity-stream-coordination-spec.md. Files under ~/.claude/activity/. Judgment layer: directives/multi-agent-coordination.md. Design: backlog/260429-multi-agent-coordination-tiers.md."
    tags: [hook, claude-code, multi-agent, coordination, session, awareness, activity-stream]
    version: "0.7.1"

  graduate_capability:
    path: "executions/graduate_capability.py"
    description: "Graduates a capability from the personal layer to the shared one as a MOVE, not a copy. Skills move and are SYMLINKED back (the harness scans only the personal skills tree, so a plain move silently uninstalls them); executions and directives move and the personal copy is archived behind a pointer. Pre-flight REFUSES a graduation that would leave the shared layer holding a fragment (siblings of the same capability staying behind), that carries operator identifiers, or that depends on personal-layer code. Conflicts by CONTENT HASH, never version. Dry-run by default. Supersedes my-lib graduate_files.py v1.0.0, which could not graduate a directory and therefore never got used."
    tags: [graduation, team-lib, move-not-copy, split-capability, governance]
    version: "2.0.0"
