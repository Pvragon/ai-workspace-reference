# summary: Team indexed context registry. Lists on-demand context files in team-lib/context/indexed/.
# Context Registry (team)
# ------------------------------------------
# This manifest catalogs on-demand context files.
#
# Schema:
#   context:
#     <name>:
#       path: <string>           # Relative path to context file
#       description: <string>    # Brief description
#       tags: [<string>, ...]    # Searchable tags
#
# ------------------------------------------

context:
  copy-stance-no-self-narration:
    path: context/indexed/copy-stance-no-self-narration.md
    description: POINTER ONLY. The stance rules moved to skills/humanizer-supplement/SKILL.md on 2026-09-20,
      where they are three patterns rather than four. Kept so older references resolve; do not edit it
      and do not load it as the rule.
  editor-setup-guide:
    path: context/indexed/editor-setup-guide.md
    description: 'Editor and IDE setup guidance for the AI Workspace: Obsidian vault configuration,
      VS Code multi-root workspace setup, and recommended roots. Extracted from workspace-reference.md
      Section 9. v2.0.0 (2026-06-11): vault root moved from workspace root to personal/ — the workspace
      grew to ~900k files, which Obsidian cannot exclude from scanning; cross-silo linking now via gitignored
      symlinks.'
    tags:
    - editor
    - vscode
    - obsidian
    - setup
    - configuration
  execution-standard:
    path: context/indexed/execution-standard.md
    description: 'Defines the dual-purpose execution script pattern: CLI + importable run() function,
      comment-block frontmatter requirement, return contract, chaining rules, a test or --self-check for
      every non-trivial logic change, and `shortcut:` markers for deliberate shortcuts. Load when creating
      or reviewing execution scripts.'
    tags:
    - executions
    - standard
    - python
    - scripting
  memory-system:
    path: context/indexed/memory-system.md
    description: 'Build-and-operate spec for the agent memory system shipped in team-lib: the five tiers,
      the two-strength retrieval policy with its formula and constants, the frontmatter schema every consumer
      relies on, the nightly sleep cycle, the four hooks, the one-command install, and the regression
      suite that proves the ranking rather than the wiring. Read before changing any memory component.'
    tags:
    - memory
    - retrieval
    - decay
    - scheduler
    - hooks
    - agent-infrastructure
    - install
  nick-saraev-doe-framework:
    path: context/indexed/nick-saraev-doe-framework.md
    description: 'Nick Saraev''s DOE (Directive-Orchestration-Execution) framework for reliable AI agent
      systems: 3-layer architecture, self-annealing, error compounding math, and implementation patterns.
      Load for DOE theory and design rationale.'
    tags:
    - doe
    - framework
    - theory
    - architecture
  nodejs-workspace-setup:
    path: context/indexed/nodejs-workspace-setup.md
    description: 'Node.js global npm setup: NODE_PATH configuration for global require() support, when
      to use global vs local install. Load when troubleshooting npm or setting up Node.js tooling.'
    tags:
    - nodejs
    - npm
    - setup
    - configuration
  progressive-disclosure-convention:
    path: context/indexed/progressive-disclosure-convention.md
    description: 'Defines the progressive disclosure convention for agent-consumable files: summary frontmatter
      field requirements, index aggregation pattern, summary writing guidelines, and the skill listing
      layer (listing, category, find-skill). Read when creating or updating any agent-consumable file.'
    tags:
    - conventions
    - frontmatter
    - summary
    - progressive-disclosure
  project-docs-standard:
    path: context/indexed/project-docs-standard.md
    description: Standard structure for the docs/ directory within any project in projects/. Covers trust
      boundaries, mutability rules, naming conventions, and scaffolding. Extracted from workspace-reference.md
      Appendix A.
    tags:
    - projects
    - documentation
    - specs
    - conventions
    - structure
  terminal-pane-house-style:
    path: context/indexed/terminal-pane-house-style.md
    description: 'The house style for small terminal panes on the Omarchy desktop (to-do pane, music pane,
      and the everpresent Your Agent dashboard): live theme colors, one orange signal, the header and section
      grammar, glyphs, motion, input handling, and how a pane lays out from a 68-column tile up to fullscreen.
      Read before building or restyling any pane.'
  workspace-reference:
    path: context/indexed/workspace-reference.md
    description: 'Canonical architectural reference for the AI Workspace: 4-layer hierarchy, directory
      conventions, functional stack, agent identity system, registry strategy, governance, and project
      docs structure.'
    tags:
    - workspace
    - architecture
    - conventions
    - reference
    - agent-identity
subdirectories:
  templates:
    path: context/indexed/templates/
    description: Reference templates for AGENTS.md / CLAUDE.md / GEMINI.md files across the workspace
    tags:
    - templates
    - agents
    - configuration
