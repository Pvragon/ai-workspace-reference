- name: prepare-image-for-print
  description: 'Take a low-resolution or damaged photo to a print-ready file at the size and medium the
    source can HONESTLY support. Diagnose first: required DPI falls out of VIEWING DISTANCE (3438/inches),
    not a fixed 300 — so large prints often need LESS resolution than small ones, and the binding constraint
    is how large the invented detail prints. Separates the two causes of softness that look identical
    and behave oppositely: dark+soft is JPEG compression loss (super-resolution can plausibly fill) while
    bright+soft is optical defocus (NO upscaler fixes it; sharpening around it makes it worse). Four-tier
    fidelity ladder — Lanczos / Real-ESRGAN (default) / ControlNet-Tile / general image models — with
    medium-forgiveness guidance (canvas forgives, acrylic prosecutes) and framing, matting, spacer and
    mounting rules. Always reports % reconstructed; never presents invented detail as recovered.'
