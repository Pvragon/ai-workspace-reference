# summary: Team skills registry. Lists available shared skills with paths, capabilities, and dependencies.
# Skills Registry (team)
# ------------------------------------------
# This manifest catalogs available team agent skills.
#
# Schema:
#   skills:
#     - name: <string>           # Unique identifier
#       description: <string>    # Brief description
#       path: <string>           # Relative path to skill definition
#       capabilities: [<string>, ...]  # What this skill enables
#       dependencies: [<string>, ...]  # Required skills or tools
#       version: <string>        # Semantic version
#       source: <string>         # DERIVED provenance: team | local | external | project | system | synced
#       provider: <string>       # DERIVED: origin pack for _external/ skills, else "internal"
#       listing: <on|name-only|user-only>  # DERIVED: what the harness shows the model. Edit the
#                                # SKILL.md frontmatter (externals: config/skill-listing.yaml),
#                                # never this entry; rendered into Claude Code skillOverrides.
#       category: <string>       # DERIVED, same owners; one name from config/skill-categories.yaml
#       status: <string>         # "active" (default, omitted) or "deprecated"
#
# Search hierarchy (Operating Principle #1):
#   Run the find-skill skill first: it searches this manifest (with my-lib's and the current
#   project's) by keyword and category and ranks equal matches in this order:
#   1. Internal skills (source: team / local / project)
#   2. External skills (source: external)
#   When multiple skills match a query, prefer internal over external.
#
# ------------------------------------------

# ------------------------------------------------------------------------------------
# NOTES MIGRATED INTO THE HEADER 2026-08-08. This manifest is now GENERATED, and PyYAML
# cannot round-trip comments inside the data region — so the generator refused to write
# rather than silently delete these. They are preserved verbatim below.
#
# Section dividers that were organisational only (`# --- Provider: X ---`, `# C-Level`)
# are NOT preserved: generation sorts entries, so a divider no longer marks anything.
# The fact they carried is now the DERIVED `provider:` field on each entry.
# ------------------------------------------------------------------------------------
