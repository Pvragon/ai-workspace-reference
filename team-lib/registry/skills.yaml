- name: resume-sessions
  description: Rebuild the whole Claude session fleet from a /store-sessions snapshot — one Windows Terminal
    window per session, each RE-ATTACHING to its still-live tmux session (closed window, no reboot) or
    RESUMING from disk (claude --resume <id> -n <name>) post-reboot, tmux label = Claude name, in the
    original cwd. Thin wrapper over executions/session_snapshots.py resume. Defaults to newest snapshot;
    accepts YYMMDD/file. AUTO-RECONCILES the snapshot against the transcript logs (--no-reconcile opts
    out) so workstreams that rotated generation via /handoff after the snapshot are never lost — the snapshot
    alone is never current, and the logs alone can't tell open-but-idle from closed. Guarantees nothing
