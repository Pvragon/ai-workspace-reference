    dependencies: [python3, git, gh, git-filter-repo]
    tags: [security, malware, incident-response, scan, eradicate, supply-chain, exposure, credentials]
    version: "2.3.0"
    # 4-phase incident kit: scan (detect) -> Step 1 eradicate -> Step 1.5 assess_exposure.sh (did the
