  # ============================================================
  # EXTERNAL SKILLS (lower priority in search hierarchy)
  # ============================================================
  # These are third-party skills from submodules in skills/_external/.
  # When an internal skill and external skill both match a query,
  # ALWAYS prefer the internal skill.
  #
  # Naming convention (adopted 2026-04-17):
  #   All external skills are named `ext-<original>` in this registry, where
  #   <original> is the skill's intrinsic frontmatter name (not the submodule
  #   directory name). The `ext-*` prefix matches the symlink names under
  #   my-lib/.claude/skills/, which is what Claude Code's skill-discovery
  #   system sees at runtime. Invoke these skills by their `ext-*` name.
  #
  #   Examples:
  #     - Anthropic `canvas-design`  → invoked as `ext-canvas-design`
  #     - Anthropic `docx`           → invoked as `ext-docx`
  #     - Blader submodule (frontmatter name: `humanizer`) → `ext-humanizer`
  #
  # Path handling (Option A — source-of-truth):
  #   `path:` points to the ORIGINAL SKILL.md inside
  #   team-lib/skills/_external/<provider>/... (the source of truth for the
  #   skill's content). The runtime-invoked symlink lives at
  #   my-lib/.claude/skills/ext-<original>/SKILL.md. We keep paths pointing at
  #   the source file to preserve provenance and avoid crossing library
  #   boundaries inside this team-lib registry.
  #
  # Not wired:
  #   Anthropic's blank `template` scaffold (_external/anthropics/template/)
  #   is intentionally NOT symlinked and NOT listed in this registry — it is
  #   a scaffold, not a usable skill.
  #
  # Security scan provenance:
  #   Trust tier, last-scanned SHA, LLM semantic review verdict, and any
  #   findings live in team-lib/registry/skills-scan-state.yaml.
  #
  # Onboarding new external libraries:
  #   Do NOT adopt a new external library directly into this registry —
  #   route it through the curation pipeline (backlog #35) and the scanner
  #   (backlog #36) first.
  # ------------------------------------------------------------

