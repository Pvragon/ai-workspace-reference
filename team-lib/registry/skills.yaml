- name: scan-for-malware
  description: 'Scan AND eradicate the Pvragon two-family credential-stealer malware (Family A self-decoding
    IIFE loader in postcss/eslint/woff2; Family B curl-pipe-bash dropper in .vscode/tasks.json; commit-hijack
    auto-push engine). SCAN: walks every git object across all branches/tags/PR refs plus working trees;
    catches new variants via recursive multi-layer decode (base64/hex/unicode/fromCharCode/unescape),
    a behavioral heuristic for executable behavior inside declarative config carriers, and type/magic-byte
    mismatch — not just known SHAs; emits a coverage block so there are no silent gaps. ERADICATE (eradicate.sh):
    self-serve cleans ONE infected repo you can push to — dry-run by default; --apply/--yes backs up the
    remote (never deleted), git-filter-repo-strips malicious + temp_*_push.bat engine blobs, restores
    clean carriers (tailwind v3/v4-aware postcss, eslint, vscode settings), force-pushes --all/--tags,
    re-clone-verifies, and WIP-guarded re-syncs the local clone. Push-access + uncommitted/unpushed-work
    guarded; owner-only (won''t escalate).'
  path: skills/scan-for-malware/SKILL.md
  capabilities:
  - security-scan
  - malware-detection
  - incident-response
  - supply-chain-audit
  - malware-eradication
  - git-history-rewrite
  - exposure-assessment
